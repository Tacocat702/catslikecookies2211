<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cat Searcher · catslikecookies2211</title>
  <style>
    :root {
      --bg: #020617;
      --card: #0f172a;
      --accent: #f97316;
      --accent2: #38bdf8;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b, #020617);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .shell {
      width: min(700px, 100%);
      padding: 20px;
      border-radius: 20px;
      background: radial-gradient(circle at top left, rgba(248,250,252,0.08), rgba(15,23,42,0.95));
      border: 1px solid rgba(148,163,184,0.6);
      box-shadow: 0 24px 60px rgba(15,23,42,0.9);
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .title span {
      background: linear-gradient(120deg, #f97316, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      color: transparent;
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      background: rgba(15,23,42,0.9);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    input::placeholder {
      color: #6b7280;
    }

    button {
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      background: radial-gradient(circle at top left, #f97316, #ea580c);
      color: #020617;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(248,113,22,0.6);
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(255,255,255,0.4), transparent 60%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    button:hover::after {
      opacity: 1;
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .result-card {
      margin-top: 8px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(55,65,81,0.9);
      display: flex;
      gap: 12px;
      align-items: center;
      min-height: 80px;
    }

    .cat-art {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .cat-info-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .cat-info-desc {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .cat-tags {
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="title">
      Cat searcher <span>internet lab</span>
    </div>
    <div class="sub">
      Type a word like <strong>rainbow</strong>, <strong>grumpy</strong>, or <strong>space</strong> and see which cat appears.
    </div>

    <div class="search-row">
      <input id="query" placeholder="try: rainbow, grumpy, space, sleepy, cookie..." />
      <button id="searchBtn">Search cat 🔍</button>
    </div>

    <div class="hint">
      This doesn’t go to the real internet—it’s your own tiny “cat internet” with custom results.
    </div>

    <div class="result-card" id="result">
      <div class="cat-art" id="catArt">🐱</div>
      <div>
        <div class="cat-info-title" id="catTitle">Waiting for a search…</div>
        <div class="cat-info-desc" id="catDesc">
          Type something above to see what kind of cat your word matches.
        </div>
        <div class="cat-tags" id="catTags">No tags yet.</div>
      </div>
    </div>
  </div>

  <script>
    const searchBtn = document.getElementById('searchBtn');
    const queryInput = document.getElementById('query');
    const catArt = document.getElementById('catArt');
    const catTitle = document.getElementById('catTitle');
    const catDesc = document.getElementById('catDesc');
    const catTags = document.getElementById('catTags');

    function getCatResult(word) {
      const q = word.toLowerCase().trim();

      if (!q) {
        return {
          emoji: '🐱',
          title: 'Empty search cat',
          desc: 'You didn’t type anything, so this cat is just chilling.',
          tags: 'neutral · idle · waiting'
        };
      }

      if (q.includes('rainbow')) {
        return {
          emoji: '🌈🐱',
          title: 'Rainbow trail cat',
          desc: 'A nyan‑style rainbow cat zooming across the sky in your imagination.',
          tags: 'colorful · fast · meme vibes'
        };
      }

      if (q.includes('grumpy') || q.includes('mad') || q.includes('angry')) {
        return {
          emoji: '😾',
          title: 'Grumpy mood cat',
          desc: 'This cat is unimpressed with everything and probably judging your search.',
          tags: 'grumpy · sarcastic · low patience'
        };
      }

      if (q.includes('space') || q.includes('galaxy') || q.includes('star')) {
        return {
          emoji: '🚀🐱',
          title: 'Space explorer cat',
          desc: 'Floating through the cosmos, chasing laser pointers among the stars.',
          tags: 'cosmic · curious · zero‑gravity'
        };
      }

      if (q.includes('sleep') || q.includes('tired') || q.includes('nap')) {
        return {
          emoji: '😴🐱',
          title: 'Sleepy nap cat',
          desc: 'Curled up in a warm spot, dreaming of endless treats and soft blankets.',
          tags: 'cozy · calm · nap time'
        };
      }

      if (q.includes('cookie') || q.includes('snack') || q.includes('food')) {
        return {
          emoji: '🍪🐱',
          title: 'Snack hunter cat',
          desc: 'Always on the lookout for crumbs, treats, and suspiciously unattended cookies.',
          tags: 'hungry · sneaky · snack‑powered'
        };
      }

      if (q.includes('zoom') || q.includes('fast') || q.includes('hyper')) {
        return {
          emoji: '⚡🐱',
          title: 'Zoomies cat',
          desc: 'Running full speed at 3am for absolutely no reason.',
          tags: 'hyper · chaotic · high energy'
        };
      }

      // default: unknown word
      return {
        emoji: '❓🐱',
        title: 'Mystery internet cat',
        desc: 'Your word doesn’t match a known cat yet, so this one is mysterious and unique.',
        tags: 'unknown · custom · you decide the lore'
      };
    }

    function runSearch() {
      const word = queryInput.value;
      const result = getCatResult(word);

      catArt.textContent = result.emoji;
      catTitle.textContent = result.title;
      catDesc.textContent = result.desc;
      catTags.textContent = result.tags;
    }

    searchBtn.addEventListener('click', runSearch);

    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        runSearch();
      }
    });
  </script>
</body>
</html>
